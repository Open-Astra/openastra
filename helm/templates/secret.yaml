{{- if .Values.secret.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "astra.secretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "astra.labels" . | nindent 4 }}
  annotations:
    # Secrets managed by Helm are stored in the release history.
    # For production workloads consider External Secrets Operator or Vault
    # and set secret.create=false to supply your own Secret.
    helm.sh/resource-policy: keep
type: Opaque
# stringData lets you supply plain-text values — Kubernetes base64-encodes
# them at apply time, so values.yaml values do not need pre-encoding.
stringData:
  # ── Application secrets ──────────────────────────────────────────────────
  # `required` aborts the render instead of shipping empty-string secrets.
  JWT_SECRET: {{ required "secret.jwtSecret is required when secret.create=true (openssl rand -hex 32)" .Values.secret.jwtSecret | quote }}
  INTERNAL_API_KEY: {{ required "secret.internalApiKey is required when secret.create=true (openssl rand -hex 32)" .Values.secret.internalApiKey | quote }}
  TYPESENSE_API_KEY: {{ required "secret.typesenseApiKey is required when secret.create=true" .Values.secret.typesenseApiKey | quote }}

  # ── PostgreSQL password ──────────────────────────────────────────────────
  # Host, port, database and user are not secret; the Deployment sets them
  # directly from values.
  PG_PASSWORD: {{ required "postgres.password is required when secret.create=true" .Values.postgres.password | quote }}
{{- end }}
