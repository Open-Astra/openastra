# ── Astra: External Secrets Operator Manifests ──────────────────────
#
# Prerequisites:
#   1. Install the External Secrets Operator:
#      helm repo add external-secrets https://charts.external-secrets.io
#      helm install external-secrets external-secrets/external-secrets \
#        -n external-secrets-system --create-namespace
#
#   2. Create an IAM role (IRSA) or user with GetSecretValue permission on
#      the target AWS Secrets Manager secret, and annotate the ServiceAccount
#      (or set AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY as env/IRSA).
#
#   3. Store all Astra secrets as a single JSON blob in AWS Secrets Manager:
#      aws secretsmanager create-secret \
#        --name astra/prod \
#        --secret-string '{
#          "JWT_SECRET": "...",
#          "INTERNAL_API_KEY": "...",
#          "TYPESENSE_API_KEY": "...",
#          "PG_PASSWORD": "...",
#          "ANTHROPIC_API_KEY": "...",
#          "OPENAI_API_KEY": "..."
#        }'
#
#   4. Apply this file:
#      kubectl apply -f k8s/external-secrets.yaml
#
# The operator will sync the Kubernetes Secret "astra-secrets" every 1 hour.
# Mount it into your pods as environment variables (see Deployment example
# at the bottom of this file).

---
# ── Namespace ─────────────────────────────────────────────────────────
# Change this to match your deployment namespace.
apiVersion: v1
kind: Namespace
metadata:
  name: astra
  labels:
    app.kubernetes.io/name: astra
    app.kubernetes.io/component: secrets

---
# ── SecretStore ───────────────────────────────────────────────────────
# Defines the connection to AWS Secrets Manager.
# Scoped to the "astra" namespace — use ClusterSecretStore for cross-namespace.
#
# Authentication options (choose one):
#   a) IRSA (recommended on EKS): annotate the ServiceAccount with the IAM role ARN.
#   b) Explicit credentials: reference a Kubernetes Secret with accessKeyID /
#      secretAccessKey (less preferred; use IRSA where possible).
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: astra-aws-secret-store
  namespace: astra
  labels:
    app.kubernetes.io/name: astra
    app.kubernetes.io/component: secret-store
spec:
  provider:
    aws:
      service: SecretsManager
      # Region where the AWS Secrets Manager secret lives.
      # Override via the AWS_REGION env var or change the value here.
      region: us-east-1
      # IRSA: the ESO controller ServiceAccount must be annotated with
      #   eks.amazonaws.com/role-arn: arn:aws:iam::<account>:role/<role>
      # If using explicit credentials instead, uncomment and populate:
      # auth:
      #   secretRef:
      #     accessKeyIDSecretRef:
      #       name: aws-credentials
      #       key: access-key-id
      #     secretAccessKeySecretRef:
      #       name: aws-credentials
      #       key: secret-access-key

---
# ── ExternalSecret ────────────────────────────────────────────────────
# Syncs individual keys from the astra/prod JSON blob in AWS Secrets Manager
# into a Kubernetes Secret named "astra-secrets".
#
# Each entry under `data` maps:
#   secretKey  → name of the key in the resulting Kubernetes Secret
#   remoteRef  → AWS secret name + property (JSON key within the blob)
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: astra-external-secret
  namespace: astra
  labels:
    app.kubernetes.io/name: astra
    app.kubernetes.io/component: external-secret
spec:
  # How often the operator polls AWS for changes.
  refreshInterval: 1h

  secretStoreRef:
    name: astra-aws-secret-store
    kind: SecretStore

  # The Kubernetes Secret that will be created / kept in sync.
  target:
    name: astra-secrets
    # Delete the Kubernetes Secret when the ExternalSecret is deleted.
    deletionPolicy: Delete
    template:
      metadata:
        labels:
          app.kubernetes.io/name: astra
          app.kubernetes.io/component: secrets
      # Encode all values as Opaque (base64 in etcd, plaintext in pod env).
      type: Opaque

  # Map each JSON property from the single AWS secret blob to a Kubernetes key.
  data:
    - secretKey: JWT_SECRET
      remoteRef:
        key: astra/prod
        property: JWT_SECRET

    - secretKey: INTERNAL_API_KEY
      remoteRef:
        key: astra/prod
        property: INTERNAL_API_KEY

    - secretKey: TYPESENSE_API_KEY
      remoteRef:
        key: astra/prod
        property: TYPESENSE_API_KEY

    - secretKey: PG_PASSWORD
      remoteRef:
        key: astra/prod
        property: PG_PASSWORD

    - secretKey: ANTHROPIC_API_KEY
      remoteRef:
        key: astra/prod
        property: ANTHROPIC_API_KEY

    - secretKey: OPENAI_API_KEY
      remoteRef:
        key: astra/prod
        property: OPENAI_API_KEY

---
# ── Example Deployment snippet ────────────────────────────────────────
# Shows how to consume the synced Kubernetes Secret as env vars in your
# gateway Deployment. This is illustrative only — merge into your actual
# Deployment manifest rather than applying this block directly.
#
# spec:
#   template:
#     spec:
#       containers:
#         - name: gateway
#           image: astra/gateway:latest
#           envFrom:
#             - secretRef:
#                 name: astra-secrets
#           # Or reference individual keys:
#           env:
#             - name: JWT_SECRET
#               valueFrom:
#                 secretKeyRef:
#                   name: astra-secrets
#                   key: JWT_SECRET
#             - name: PG_PASSWORD
#               valueFrom:
#                 secretKeyRef:
#                   name: astra-secrets
#                   key: PG_PASSWORD
