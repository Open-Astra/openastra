{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "astra.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "astra.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "astra.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Only the gateway HTTP port is reachable.
    - ports:
        - protocol: TCP
          port: {{ .Values.service.targetPort }}
      {{- with .Values.networkPolicy.ingressFrom }}
      from:
        {{- toYaml . | nindent 8 }}
      {{- end }}
  egress:
    {{- if .Values.networkPolicy.egress.allowDNS }}
    - ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    {{- end }}
    # PostgreSQL, Typesense and outbound HTTPS (LLM providers), excluding the
    # cloud metadata endpoint.
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            {{- with .Values.networkPolicy.egress.exceptCidrs }}
            except:
              {{- toYaml . | nindent 14 }}
            {{- end }}
      ports:
        - protocol: TCP
          port: {{ .Values.postgres.port }}
        - protocol: TCP
          port: {{ .Values.typesense.port }}
        {{- range .Values.networkPolicy.egress.ports }}
        - protocol: TCP
          port: {{ . }}
        {{- end }}
    {{- with .Values.networkPolicy.egress.extra }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
{{- end }}
