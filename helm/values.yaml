# ── OpenAstra Gateway — Default Values ───────────────────────────────────────
# Override any of these in a separate values file or with --set flags.
# Example: helm install openastra ./helm -f values-prod.yaml

# -- Number of gateway replicas.
replicaCount: 1

image:
  # -- Container image repository. No public image is published yet — build
  # the repo's Dockerfile and push it to your own registry, then set this.
  repository: openastra/gateway
  # -- Image tag. Defaults to the chart's appVersion when "". Never use a
  # floating tag such as "latest": with IfNotPresent, nodes would silently
  # run different builds. Prefer an immutable version tag or set `digest`.
  tag: ""
  # -- Optional image digest (sha256:...). Takes precedence over tag.
  digest: ""
  # -- Image pull policy.
  pullPolicy: IfNotPresent

# -- Secrets used to pull images from a private registry.
# ref: https://kubernetes.io/docs/tasks/configure-pod-container/pull-image-private-registry/
imagePullSecrets: []
# - name: regcred

# -- Override the default chart name.
nameOverride: ""
# -- Override the full release name.
fullnameOverride: ""

# ── Service Account ───────────────────────────────────────────────────────────
serviceAccount:
  # -- Whether to create a ServiceAccount.
  create: true
  # -- Annotations to add to the ServiceAccount (e.g. IRSA role ARN).
  annotations: {}
  # -- Name of the ServiceAccount to use. Auto-generated when empty.
  name: ""

# ── Pod Annotations & Labels ─────────────────────────────────────────────────
podAnnotations: {}
podLabels: {}

# ── Pod Security Context ──────────────────────────────────────────────────────
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000
  seccompProfile:
    type: RuntimeDefault

# ── Container Security Context ────────────────────────────────────────────────
securityContext:
  runAsNonRoot: true
  runAsUser: 1000
  # The root filesystem is read-only; the deployment mounts an in-memory
  # emptyDir at /tmp for anything the app needs to write.
  readOnlyRootFilesystem: true
  allowPrivilegeEscalation: false
  seccompProfile:
    type: RuntimeDefault
  capabilities:
    drop:
      - ALL

# ── Service ───────────────────────────────────────────────────────────────────
service:
  # -- Kubernetes service type: ClusterIP | NodePort | LoadBalancer.
  type: ClusterIP
  # -- Service port exposed to the cluster.
  port: 8080
  # -- Target container port.
  targetPort: 8080
  # -- NodePort when type is NodePort. Leave 0 to auto-assign.
  nodePort: 0
  # -- Additional annotations for the Service (e.g. NLB annotations on AWS).
  annotations: {}

# ── Ingress ───────────────────────────────────────────────────────────────────
ingress:
  # -- Enable Ingress resource.
  enabled: false
  # -- IngressClass name (e.g. nginx, traefik, alb).
  className: "nginx"
  # -- Additional annotations for the Ingress.
  annotations: {}
  #   cert-manager.io/cluster-issuer: letsencrypt-prod
  #   nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
  #   nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
  # -- Ingress host rules.
  hosts: []
  # - host: astra.example.com
  #   paths:
  #     - path: /
  #       pathType: Prefix
  # -- TLS configuration.
  tls: []
  # - secretName: astra-tls
  #   hosts:
  #     - astra.example.com

# ── Resource Requests & Limits ────────────────────────────────────────────────
resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: 2000m
    memory: 2Gi

# ── Horizontal Pod Autoscaler ─────────────────────────────────────────────────
autoscaling:
  # -- Enable HPA.
  enabled: false
  # -- Minimum replica count.
  minReplicas: 1
  # -- Maximum replica count.
  maxReplicas: 5
  # -- CPU utilization target percentage.
  targetCPUUtilizationPercentage: 70
  # -- Memory utilization target percentage. Uncomment to enable.
  # targetMemoryUtilizationPercentage: 80

# ── Pod Disruption Budget ─────────────────────────────────────────────────────
podDisruptionBudget:
  # -- Enable PodDisruptionBudget. The PDB is only rendered when at least two
  # replicas run (replicaCount >= 2, or autoscaling.minReplicas >= 2): with a
  # single replica any budget would block node drains indefinitely.
  enabled: true
  # -- Maximum pods that may be unavailable during a voluntary disruption.
  maxUnavailable: 1
  # -- Alternative: minimum pods that must stay available (integer or "50%").
  # When set it takes precedence over maxUnavailable.
  minAvailable: ""

# ── Network Policy ────────────────────────────────────────────────────────────
networkPolicy:
  # -- Render a NetworkPolicy restricting gateway traffic. Requires a CNI that
  # enforces NetworkPolicy (Calico, Cilium, ...); otherwise it is a no-op.
  enabled: true
  # -- Sources allowed to reach the gateway port. Empty list = any pod in any
  # namespace (and node-local traffic such as kubelet probes). Tighten to your
  # ingress controller, e.g.:
  #   - namespaceSelector:
  #       matchLabels:
  #         kubernetes.io/metadata.name: ingress-nginx
  ingressFrom: []
  egress:
    # -- Allow DNS lookups (UDP/TCP 53) to any destination.
    allowDNS: true
    # -- TCP ports the gateway may connect out to, to any address except
    # `exceptCidrs`. 443 covers LLM provider APIs; the PostgreSQL and
    # Typesense ports from the sections below are added automatically.
    ports: [443]
    # -- CIDRs excluded from the egress allowance (cloud metadata endpoint).
    exceptCidrs:
      - 169.254.169.254/32
    # -- Extra raw NetworkPolicy egress rules appended verbatim.
    extra: []

# ── Probes ────────────────────────────────────────────────────────────────────
livenessProbe:
  httpGet:
    path: /health
    port: http
  # -- Seconds before the first liveness probe fires.
  initialDelaySeconds: 30
  # -- Probe interval in seconds.
  periodSeconds: 15
  # -- Number of consecutive failures to mark the container as unhealthy.
  failureThreshold: 3
  # -- Number of consecutive successes required after failure to mark healthy.
  successThreshold: 1
  # -- Probe timeout in seconds.
  timeoutSeconds: 5

readinessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 10
  periodSeconds: 10
  failureThreshold: 3
  successThreshold: 1
  timeoutSeconds: 5

# ── Application Secrets ───────────────────────────────────────────────────────
secret:
  # -- When true, the chart renders a Kubernetes Secret from the values below.
  # Set to false and supply your own Secret (or use External Secrets Operator)
  # when secrets are managed outside Helm.
  # When true, jwtSecret, internalApiKey, typesenseApiKey and
  # postgres.password are REQUIRED — the chart refuses to render with empty
  # values rather than deploying a gateway with blank secrets.
  # When false, the Secret named below must contain the keys JWT_SECRET,
  # INTERNAL_API_KEY, TYPESENSE_API_KEY and PG_PASSWORD (k8s/external-secrets.yaml
  # produces exactly these).
  create: true
  # -- Name of the Secret. Defaults to "<fullname>-secrets" when empty.
  name: ""
  # -- Core application secrets (plain text; the template uses stringData).
  # Supply with --set / a private values file — never commit real values.
  # Generate: openssl rand -hex 32
  jwtSecret: ""
  internalApiKey: ""
  typesenseApiKey: ""

# ── PostgreSQL (external — no bundled subchart) ───────────────────────────────
# Point these at your operator-managed or cloud PostgreSQL instance.
postgres:
  # -- PostgreSQL hostname or service DNS name.
  host: ""
  # -- PostgreSQL port.
  port: 5432
  # -- Database name.
  database: astra
  # -- Database user.
  user: astra
  # -- Database password. Stored in the Secret when secret.create is true.
  password: ""
  # -- When secret.create is false, reference an existing Secret for PG_PASSWORD.
  existingSecret:
    # -- Name of the existing Secret.
    name: ""
    # -- Key inside the Secret that holds the password.
    key: PG_PASSWORD

# ── Typesense (external — no bundled subchart) ────────────────────────────────
# Point these at your operator-managed Typesense instance.
typesense:
  # -- Typesense hostname or service DNS name.
  host: ""
  # -- Typesense API port.
  port: 8108
  # -- Protocol: http or https.
  protocol: http

# ── Extra Environment Variables ───────────────────────────────────────────────
# Inject arbitrary env vars into the gateway container.
# Each entry is a standard Kubernetes env var object.
env:
  extra: []
  # - name: ANTHROPIC_API_KEY
  #   valueFrom:
  #     secretKeyRef:
  #       name: llm-keys
  #       key: anthropic
  # - name: NODE_ENV
  #   value: production
  # - name: LOG_LEVEL
  #   value: info

# ── Node Scheduling ───────────────────────────────────────────────────────────
nodeSelector: {}
tolerations: []
affinity: {}

# ── Topology Spread Constraints ───────────────────────────────────────────────
# Useful for spreading replicas across AZs in production.
topologySpreadConstraints: []
# - maxSkew: 1
#   topologyKey: topology.kubernetes.io/zone
#   whenUnsatisfiable: DoNotSchedule
#   labelSelector:
#     matchLabels:
#       app.kubernetes.io/name: openastra

# ── Volumes / Volume Mounts ───────────────────────────────────────────────────
# The deployment always mounts an in-memory emptyDir at /tmp.
# The image bakes in astra.yml, prompts/ and SOUL.md; add extra volumes here
# to override them (e.g. a ConfigMap for astra.yml).
extraVolumes: []
# - name: astra-config
#   configMap:
#     name: astra-config

extraVolumeMounts: []
# - name: astra-config
#   mountPath: /app/astra.yml
#   subPath: astra.yml
#   readOnly: true

# ── Init Containers ───────────────────────────────────────────────────────────
# The chart always injects a postgres-ready init container.
# Add extra init containers here if needed.
extraInitContainers: []

# ── Deployment Strategy ───────────────────────────────────────────────────────
strategy:
  type: RollingUpdate
  rollingUpdate:
    maxSurge: 1
    maxUnavailable: 0

# ── Termination ───────────────────────────────────────────────────────────────
# Seconds the pod has to drain before SIGKILL.
terminationGracePeriodSeconds: 30
