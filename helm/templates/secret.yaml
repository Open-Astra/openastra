{{- if .Values.secret.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "astra.secretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "astra.labels" . | nindent 4 }}
  annotations:
    # Secrets managed by Helm are stored in the release history.
    # For production workloads consider External Secrets Operator or Vault
    # and set secret.create=false to supply your own Secret.
    helm.sh/resource-policy: keep
type: Opaque
# stringData lets you supply plain-text values — Kubernetes base64-encodes
# them at apply time, so values.yaml values do not need pre-encoding.
stringData:
  # ── Application secrets ──────────────────────────────────────────────────
  JWT_SECRET: {{ .Values.secret.jwtSecret | default "" | quote }}
  INTERNAL_API_KEY: {{ .Values.secret.internalApiKey | default "" | quote }}
  TYPESENSE_API_KEY: {{ .Values.secret.typesenseApiKey | default "" | quote }}

  # ── PostgreSQL connection ────────────────────────────────────────────────
  PG_HOST: {{ .Values.postgres.host | default "" | quote }}
  PG_PORT: {{ .Values.postgres.port | toString | quote }}
  PG_DATABASE: {{ .Values.postgres.database | quote }}
  PG_USER: {{ .Values.postgres.user | quote }}
  PG_PASSWORD: {{ .Values.postgres.password | default "" | quote }}
{{- end }}
