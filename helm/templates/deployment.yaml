apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "astra.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "astra.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "astra.selectorLabels" . | nindent 6 }}
  strategy:
    type: {{ .Values.strategy.type }}
    {{- if eq .Values.strategy.type "RollingUpdate" }}
    rollingUpdate:
      maxSurge: {{ .Values.strategy.rollingUpdate.maxSurge }}
      maxUnavailable: {{ .Values.strategy.rollingUpdate.maxUnavailable }}
    {{- end }}
  template:
    metadata:
      annotations:
        {{- if .Values.secret.create }}
        # Force a rollout whenever the chart-managed Secret content changes.
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        {{- end }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "astra.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "astra.serviceAccountName" . }}
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}

      # ── Init Containers ─────────────────────────────────────────────────────
      initContainers:
        # Wait for PostgreSQL to accept connections before starting the gateway.
        # Uses nc (netcat) which is present in node:20-slim via the netcat-openbsd
        # package, or falls back to a /dev/tcp shell check.
        - name: wait-for-postgres
          image: busybox:1.36.1
          imagePullPolicy: IfNotPresent
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 50m
              memory: 32Mi
          command:
            - sh
            - -c
            - |
              echo "Waiting for PostgreSQL at {{ .Values.postgres.host }}:{{ .Values.postgres.port }} ..."
              until nc -z {{ .Values.postgres.host }} {{ .Values.postgres.port }}; do
                echo "  postgres not ready — sleeping 2s"
                sleep 2
              done
              echo "PostgreSQL is reachable."
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop:
                - ALL
        {{- with .Values.extraInitContainers }}
        {{- toYaml . | nindent 8 }}
        {{- end }}

      # ── Containers ──────────────────────────────────────────────────────────
      containers:
        - name: gateway
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          {{- if .Values.image.digest }}
          image: "{{ .Values.image.repository }}@{{ .Values.image.digest }}"
          {{- else }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          {{- end }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.targetPort }}
              protocol: TCP

          # ── Environment Variables ──────────────────────────────────────────
          env:
            # Node runtime
            - name: NODE_ENV
              value: production
            - name: PORT
              value: {{ .Values.service.targetPort | quote }}

            # Application secrets — sourced from Kubernetes Secret
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "astra.secretName" . }}
                  key: JWT_SECRET
            - name: INTERNAL_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "astra.secretName" . }}
                  key: INTERNAL_API_KEY
            - name: TYPESENSE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "astra.secretName" . }}
                  key: TYPESENSE_API_KEY

            # PostgreSQL connection (non-secret settings come straight from
            # values, so an externally managed Secret only needs the four
            # secret keys: JWT_SECRET, INTERNAL_API_KEY, TYPESENSE_API_KEY,
            # PG_PASSWORD).
            - name: PG_HOST
              value: {{ required "postgres.host is required" .Values.postgres.host | quote }}
            - name: PG_PORT
              value: {{ .Values.postgres.port | quote }}
            - name: PG_DATABASE
              value: {{ .Values.postgres.database | quote }}
            - name: PG_USER
              value: {{ .Values.postgres.user | quote }}
            - name: PG_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "astra.postgresSecretName" . }}
                  key: {{ include "astra.postgresPasswordKey" . }}

            # Typesense connection
            - name: TYPESENSE_HOST
              value: {{ required "typesense.host is required" .Values.typesense.host | quote }}
            - name: TYPESENSE_PORT
              value: {{ .Values.typesense.port | quote }}
            - name: TYPESENSE_PROTOCOL
              value: {{ .Values.typesense.protocol | quote }}

            # Extra freeform env vars supplied by the operator
            {{- with .Values.env.extra }}
            {{- toYaml . | nindent 12 }}
            {{- end }}

          # ── Probes ─────────────────────────────────────────────────────────
          livenessProbe:
            {{- toYaml .Values.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.readinessProbe | nindent 12 }}

          # ── Resources ──────────────────────────────────────────────────────
          resources:
            {{- toYaml .Values.resources | nindent 12 }}

          # ── Volume Mounts ──────────────────────────────────────────────────
          volumeMounts:
            # Writable scratch space — the root filesystem is read-only.
            - name: tmp
              mountPath: /tmp
            {{- with .Values.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}

      # ── Volumes ─────────────────────────────────────────────────────────────
      volumes:
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 128Mi
        {{- with .Values.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}

      # ── Scheduling ──────────────────────────────────────────────────────────
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
