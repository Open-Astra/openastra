name: CI

on:
  push:
    branches:
      - main
  pull_request:

# Least privilege: jobs only read the repository.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  root:
    name: Root checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Dependency audit (production deps, high+)
        run: npm audit --omit=dev --audit-level=high

      - name: Typecheck, test, and build
        run: npm run ci

  dashboard:
    name: Dashboard checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Install dashboard dependencies
        working-directory: dashboard
        run: npm ci

      - name: Dependency audit (production deps, high+)
        working-directory: dashboard
        run: npm audit --omit=dev --audit-level=high

      - name: Lint and build dashboard
        working-directory: dashboard
        run: npm run ci

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Build gateway image
        run: docker build -t astra-gateway:ci .

      - name: Image runs as non-root
        run: test "$(docker run --rm --entrypoint id astra-gateway:ci -u)" != "0"

  infra:
    name: Infra lint (helm, terraform)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      # helm and terraform are preinstalled on GitHub-hosted ubuntu runners.
      - name: Helm lint + render
        run: |
          args="--set secret.jwtSecret=x --set secret.internalApiKey=x --set secret.typesenseApiKey=x --set postgres.password=x --set postgres.host=pg --set typesense.host=ts"
          helm lint ./helm $args
          helm template astra ./helm $args > /dev/null
          helm template astra ./helm $args --set replicaCount=3 > /dev/null
          helm template astra ./helm --set secret.create=false --set secret.name=astra-secrets --set postgres.host=pg --set typesense.host=ts > /dev/null

      - name: Terraform fmt + validate
        run: |
          for d in deploy/aws/terraform deploy/gcp/terraform deploy/do/terraform; do
            echo "::group::$d"
            terraform -chdir="$d" fmt -check -diff || echo "::warning::terraform fmt differences in $d"
            terraform -chdir="$d" init -backend=false -input=false
            terraform -chdir="$d" validate
            echo "::endgroup::"
          done

      - name: Shell syntax
        run: |
          bash -n deploy/deploy-droplet.sh
          bash -n deploy/aws/ec2/deploy.sh
          bash -n deploy/gcp/compute_engine/deploy.sh
